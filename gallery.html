<script>
  $(document).ready(function () {
    const galleryContainer = $(".gallery-container");
    const numberOfImages = 50;

    // List of supported formats, in priority order
    const extensions = ["webp", "jpg", "jpeg", "png", "gif", "tiff", "bmp", "avif"];

    function loadFirstAvailableImage(i, callback) {
      let found = false;
      let imageUrl = "";
      let attempts = 0;

      function tryNextExtension() {
        if (attempts >= extensions.length) return;

        const ext = extensions[attempts];
        const testUrl = `./media/img/${i}.${ext}`;
        const img = new Image();

        img.onload = function () {
          if (!found) {
            found = true;
            imageUrl = testUrl;
            callback(imageUrl);
          }
        };

        img.onerror = function () {
          attempts++;
          tryNextExtension();
        };

        img.src = testUrl;
      }

      tryNextExtension();
    }

    // Try to load an available image for each index
    for (let i = 1; i <= numberOfImages; i++) {
      loadFirstAvailableImage(i, function (imageUrl) {
        const itemId = `item-${i}`;
        const galleryItem = `
          <div class="gallery-item" id="${itemId}">
            <img src="${imageUrl}" alt="Image ${i}" oncontextmenu="return false;">
            <button class="zoom-button" data-image="${imageUrl}" title="Zoom">🔍</button>
          </div>`;
        galleryContainer.append(galleryItem);
      });
    }

    // Zoom modal logic
    galleryContainer.on("click", ".zoom-button", function () {
      const imageUrl = $(this).data("image");
      $("#imageModal").fadeIn().find(".modal-image").attr("src", imageUrl);
    });

    $(".modal-close").click(function () {
      $("#imageModal").fadeOut();
    });
  });
</script>

        <script>
          document.addEventListener("DOMContentLoaded", function () {
            const goToTopButton = document.getElementById("goToTop");
            const contactBtn = document.getElementById("goToContact");
            const contactModal = document.getElementById("contactModal");
            const closeBtn = document.getElementById("closeContact");

            // Show/hide "Go to top" on scroll
            window.addEventListener("scroll", function () {
              if (window.scrollY > 20) {
                goToTopButton.classList.add("show-go-to-top");
              } else {
                goToTopButton.classList.remove("show-go-to-top");
              }
            });

            // Scroll to top
            goToTopButton.addEventListener("click", function () {
              window.scrollTo({ top: 0, behavior: "smooth" });
            });

            // Show contact modal
            contactBtn.addEventListener("click", function () {
              contactModal.classList.remove("d-none");
            });

            // Hide contact modal
            closeBtn.addEventListener("click", function () {
              contactModal.classList.add("d-none");
            });

            // Close modal if clicked outside
            window.addEventListener("click", function (e) {
              if (e.target === contactModal) {
                contactModal.classList.add("d-none");
              }
            });
          });
        </script>
