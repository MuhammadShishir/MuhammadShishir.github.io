    <!-- Custom CSS (Ultra-Minimalist & Light Modern Theme) -->
    <style id="theme-style"> 
        :root {
            --bg-primary: #ffffff;
            --bg-secondary: #f8fafc;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --accent-color: #2563eb;
            --border-color: #e2e8f0;
        }

        @font-face {
            font-family: 'Exwayer';
            src: url('../assets/Exwayer-X3eqa.ttf') format('truetype');
            font-weight: normal;
            font-style: normal;
            font-display: swap; 
        }

        @font-face {
            font-family: 'TechnoBoard';
            src: url('../assets/fonts/TechnoBoard-519Ej.ttf') format('truetype');
            font-weight: normal;
            font-style: normal;
            font-display: swap; 
        }

        body {
            background-color: var(--bg-secondary);
            color: var(--text-main);
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            cursor: auto;
        }

        /* Animated Text */
        .animated-text-bg {
            background-image: linear-gradient(90deg, #0f172a, #475569);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            text-fill-color: transparent;
            font-family: 'Exwayer', sans-serif;
        }

        /* Banner Section */
        .banner-section {
            background: linear-gradient(to bottom, #ffffff, var(--bg-secondary));
            border-bottom: 1px solid var(--border-color);
            padding: 80px 20px;
        }   
        
        /* Logo Transitions */
        .logo-image, .logo-text {
            transition: opacity 0.2s ease-in-out;
        }

        /* Skill Badges */
        .skill-badge {
            @apply inline-flex items-center px-3.5 py-1.5 text-xs font-medium rounded-md bg-white border border-slate-200 text-slate-700 shadow-sm transition-all duration-200 ease-in-out hover:border-slate-300 hover:shadow;
            animation: fadeIn 0.6s ease-out both; 
        }

        .skill-category-block:hover .skill-badge {
            border-color: #cbd5e1; 
        }

        /* Project Card Vault */
        .project-card-vault {
            position: relative;
            border-radius: 12px;
            overflow: hidden;
            background: var(--bg-primary);
            border: 1px solid var(--border-color);
            box-shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.05);
            transition: all 0.2s ease;
            text-align: left;
        }
        
        .project-card-vault:hover {
            border-color: #cbd5e1;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.05);
            transform: translateY(-2px);
        }

        /* Widget Buttons */
        .sk-widget-btn, .sk-widget-btn span {
            color: var(--text-main) !important;
        }
        
        .sk-widget-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 10px 20px;
            background: var(--bg-primary);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            cursor: pointer;
            font-weight: 500;
            font-size: 0.875rem;
            transition: all 0.2s ease;
            box-shadow: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
        }

        .sk-widget-btn:hover {
            background: #f1f5f9;
            border-color: #cbd5e1;
            transform: translateY(-1px);
        }

        .sk-widget-btn svg {
            width: 16px;
            height: 16px;
            color: var(--text-muted);
            transition: transform 0.2s ease;
        }

        .sk-widget-btn:hover svg {
            transform: scale(1.1);
        }

        /* Keyframes */
        @keyframes fadeIn {
            0% { opacity: 0; transform: translateY(6px); }
            100% { opacity: 1; transform: translateY(0); }
        }
    </style>
