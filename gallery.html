<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script>
  $(document).ready(function () {
    const galleryContainer = $(".gallery-container");
    const numberOfImages = 17;

    for (let i = 1; i <= numberOfImages; i++) {
      const imageUrl = `./media/img/${i}.webp`;
      const itemId = `item-${i}`;
      const galleryItem = `
        <div class="gallery-item" id="${itemId}">
          <img src="${imageUrl}" alt="Image ${i}" oncontextmenu="return false;">
          <button class="zoom-button" data-image="${imageUrl}" title="Zoom">🔍</button>
        </div>`;
      galleryContainer.append(galleryItem);
    }

    galleryContainer.on("click", ".zoom-button", function () {
      const imageUrl = $(this).data("image");
      $("#imageModal").fadeIn().find(".modal-image").attr("src", imageUrl);
    });

    $(".modal-close").click(function () {
      $("#imageModal").fadeOut();
    });
  });
</script>

<style>
  .collage-gallery {
  display: grid;
  grid-template-columns: repeat(4, minmax(150px, 1fr));
  grid-auto-rows: 350px;
  gap: 1rem;
  padding: 1rem;
}

.gallery-item {
  position: relative;
  overflow: hidden;
  cursor: pointer;
}

.gallery-item img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  transition: transform 0.3s ease;
}

.gallery-item:hover img {
  transform: scale(1.05);
}

.zoom-button {
  position: absolute;
  bottom: 8px;
  right: 8px;
  font-size: 1.2rem;
  padding: 4px 8px;
  background: rgba(0, 0, 0, 0.6);
  color: white;
  border: none;
  cursor: pointer;
  border-radius: 6px;
}

.modal {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: rgba(20, 20, 20, 0.9);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 999;
}

.modal-image {
  max-width: 90%;
  max-height: 80%;
  border-radius: 1rem;
}

.modal-close {
  position: absolute;
  top: 1rem;
  right: 2rem;
  font-size: 2rem;
  color: white;
  cursor: pointer;
}


@media screen and (max-width: 768px) {
  .collage-gallery {
    grid-template-columns: repeat(1, 1fr);
    grid-auto-rows: 250px;
  }
}
</style>

<!-- Contact Modal -->
 <div id="contactModal" class="contact-modal d-none">
          <div class="contact-content">
            <h2 class="text-center text-white">Contact Me</h2>
            <span class="close-contact" id="closeContact">&times;</span>

            <!-- Contact Form -->
            <form action="https://formspree.io/f/xanegwyz" method="POST" class="mt-4">
              <div class="form-group">
                <label for="name" class="label">Name:</label>
                <input type="text" name="name" placeholder="Your Name" class="form-control  border-secondary" required>
              </div>
              <div class="form-group mt-2">
                <label for="email" class="label">Email:</label>
                <input type="email" name="_replyto" placeholder="Your Email" class="form-control  border-secondary" required>
              </div>
              <div class="form-group mt-2">
                <label for="message" class="label">Message:</label>
                <textarea name="message" rows="4" placeholder="Your Message" class="form-control  border-secondary" required></textarea>
              </div>
              <button type="submit" class="outline mt-3">Send Message</button>
            </form>
          </div>
        </div>
        <script>
          document.addEventListener("DOMContentLoaded", function () {
            const goToTopButton = document.getElementById("goToTop");
            const contactBtn = document.getElementById("goToContact");
            const contactModal = document.getElementById("contactModal");
            const closeBtn = document.getElementById("closeContact");

            // Show/hide "Go to top" on scroll
            window.addEventListener("scroll", function () {
              if (window.scrollY > 20) {
                goToTopButton.classList.add("show-go-to-top");
              } else {
                goToTopButton.classList.remove("show-go-to-top");
              }
            });

            // Scroll to top
            goToTopButton.addEventListener("click", function () {
              window.scrollTo({ top: 0, behavior: "smooth" });
            });

            // Show contact modal
            contactBtn.addEventListener("click", function () {
              contactModal.classList.remove("d-none");
            });

            // Hide contact modal
            closeBtn.addEventListener("click", function () {
              contactModal.classList.add("d-none");
            });

            // Close modal if clicked outside
            window.addEventListener("click", function (e) {
              if (e.target === contactModal) {
                contactModal.classList.add("d-none");
              }
            });
          });
        </script>
