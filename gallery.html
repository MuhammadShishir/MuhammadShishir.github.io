<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Md Kamruzzaman Shishir | Gallery</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <style>
        :root {
            --neon-cyan: #22d3ee;
            --neon-fuchsia: #f0abfc;
        }

        body {
            font-family: 'Fira Code', monospace;
            background-color: #020617;
            color: #f8fafc;
            overflow-x: hidden;
            cursor: none;
        }

        .bg-grid {
            position: fixed;
            inset: 0;
            background-image: 
                linear-gradient(to right, rgba(34, 211, 238, 0.05) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(34, 211, 238, 0.05) 1px, transparent 1px);
            background-size: 50px 50px;
            z-index: -1;
            mask-image: radial-gradient(circle at center, black, transparent 90%);
        }

        #cursor-dot {
            width: 8px; height: 8px; background: var(--neon-cyan);
            border-radius: 50%; position: fixed; pointer-events: none; z-index: 999;
        }
        #cursor-glow {
            width: 40px; height: 40px; border: 2px solid var(--neon-fuchsia);
            border-radius: 50%; position: fixed; pointer-events: none; z-index: 998;
            transition: all 0.1s ease-out; opacity: 0.6;
        }

        .bento-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            grid-auto-rows: 240px;
            gap: 1.5rem;
        }

        .bento-item {
            position: relative;
            border-radius: 20px;
            overflow: hidden;
            background: #0f172a;
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: border-color 0.3s ease;
        }

        .bento-item:hover {
            border-color: var(--neon-cyan);
        }

        .span-h-2 { grid-row: span 2; }
        .span-w-2 { grid-column: span 2; }

        /* Modal Styles */
        #lightbox {
            display: none;
            opacity: 0;
            transition: opacity 0.4s ease;
        }
        #lightbox.active {
            display: flex;
            opacity: 1;
        }

        @media (max-width: 768px) {
            .span-w-2 { grid-column: span 1; }
            body { cursor: auto; }
            #cursor-dot, #cursor-glow { display: none; }
        }
    </style>
</head>
<body>

    <div class="bg-grid"></div>
    <div id="cursor-dot"></div>
    <div id="cursor-glow"></div>

    <nav class="fixed top-0 w-full z-50 px-8 py-6 flex justify-between items-center backdrop-blur-md border-b border-white/5">
        <div class="flex items-center gap-4">
            <a href="index.html" class="w-10 h-10 flex items-center justify-center rounded-full bg-white/5 hover:bg-cyan-500 transition-colors">
                <i class="fas fa-home text-sm"></i>
            </a>
            <span class="font-bold tracking-tight text-xl">
                Md Kamruzzaman Shishir <span class="text-cyan-500">|</span> <span class="text-fuchsia-400">Gallery</span>
            </span>
        </div>
    </nav>

    <main class="container mx-auto px-6 pt-32 pb-24">
        <div class="mb-16">
            <h2 class="text-5xl md:text-7xl font-black tracking-tighter uppercase italic">
                The <span class="text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 to-fuchsia-500">Archive</span>
            </h2>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-8 mb-16">
            <div class="aspect-video rounded-3xl overflow-hidden border border-white/10 shadow-2xl bg-black">
                <iframe class="w-full h-full" src="https://www.youtube.com/embed/pkVka8jisVg" frameborder="0" allowfullscreen></iframe>
            </div>
            <div class="aspect-video rounded-3xl overflow-hidden border border-white/10 shadow-2xl bg-black">
                <iframe class="w-full h-full" src="https://www.facebook.com/plugins/video.php?href=https%3A%2F%2Fwww.facebook.com%2Fmksbd2022%2Fvideos%2F714632553897115%2F&show_text=false" frameborder="0" allowfullscreen></iframe>
            </div>
        </div>

        <div id="gallery-root" class="bento-grid">
            </div>
    </main>

    <div id="lightbox" class="fixed inset-0 z-[100] flex items-center justify-center bg-black/95 backdrop-blur-xl p-4 md:p-12">
        <button id="close-lightbox" class="absolute top-8 right-8 text-white/50 hover:text-cyan-400 text-3xl z-[110]">
            <i class="fas fa-times"></i>
        </button>
        
        <button id="prev-btn" class="absolute left-4 md:left-8 text-white/30 hover:text-cyan-400 text-4xl transition-all z-[110]">
            <i class="fas fa-chevron-left"></i>
        </button>
        
        <img id="lightbox-img" src="" class="max-w-full max-h-full rounded-lg shadow-2xl border border-white/10 object-contain transition-transform duration-500 transform scale-95">
        
        <button id="next-btn" class="absolute right-4 md:right-8 text-white/30 hover:text-cyan-400 text-4xl transition-all z-[110]">
            <i class="fas fa-chevron-right"></i>
        </button>
    </div>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script>
        // --- 1. CURSOR LOGIC ---
        const dot = document.getElementById('cursor-dot');
        const glow = document.getElementById('cursor-glow');
        
        document.addEventListener('mousemove', (e) => {
            dot.style.left = e.clientX + 'px';
            dot.style.top = e.clientY + 'px';
            setTimeout(() => {
                glow.style.left = (e.clientX - 16) + 'px';
                glow.style.top = (e.clientY - 16) + 'px';
            }, 40);
        });

        $(document).ready(function () {
            const container = $("#gallery-root");
            const total = 30;
            const exts = ["webp", "jpg", "png"];
            let imagesArray = []; // To store image paths for navigation
            let currentIndex = 0;

            // --- 2. GALLERY LOADING ---
            function init() {
                for (let i = 1; i <= total; i++) {
                    let span = "";
                    if (i === 1 || i === 8) span = "span-w-2 span-h-2";
                    else if (i % 5 === 0) span = "span-h-2";
                    load(i, span);
                }
            }

            function load(id, span) {
                let eIdx = 0;
                function check() {
                    if (eIdx >= exts.length) return;
                    const src = `./media/img/${id}.${exts[eIdx]}`;
                    const img = new Image();
                    img.onload = () => {
                        imagesArray.push(src); // Add to sequence
                        const itemIdx = imagesArray.length - 1;
                        
                        container.append(`
                            <div class="bento-item ${span} group cursor-pointer gallery-trigger" data-index="${itemIdx}" data-src="${src}">
                                <img src="${src}" class="w-full h-full object-cover transition-all duration-700 group-hover:scale-110">
                                <div class="absolute inset-0 bg-gradient-to-t from-black via-transparent to-transparent opacity-0 group-hover:opacity-100 transition-all duration-500 flex flex-col justify-end p-6">
                                    <span class="text-[10px] font-mono text-cyan-400">VAULT_FILE: ${id}</span>
                                    <h4 class="font-bold text-lg text-white uppercase">Visual Asset</h4>
                                </div>
                            </div>
                        `);
                    };
                    img.onerror = () => { eIdx++; check(); };
                    img.src = src;
                }
                check();
            }

            init();

            // --- 3. 3D TILT ---
            $(document).on("mousemove", ".bento-item", function(e) {
                const rect = this.getBoundingClientRect();
                const x = e.clientX - rect.left, y = e.clientY - rect.top;
                const xc = rect.width / 2, yc = rect.height / 2;
                const dx = x - xc, dy = y - yc;
                $(this).css("transform", `perspective(1000px) rotateY(${dx / 25}deg) rotateX(${-dy / 25}deg)`);
            });

            $(document).on("mouseleave", ".bento-item", function() {
                $(this).css("transform", "perspective(1000px) rotateY(0deg) rotateX(0deg)");
            });

            // --- 4. MODAL & NAVIGATION ---
            const $modal = $("#lightbox");
            const $modalImg = $("#lightbox-img");

            function updateModal() {
                $modalImg.removeClass("scale-100").addClass("scale-95");
                setTimeout(() => {
                    $modalImg.attr("src", imagesArray[currentIndex]);
                    $modalImg.removeClass("scale-95").addClass("scale-100");
                }, 150);
            }

            $(document).on("click", ".gallery-trigger", function() {
                currentIndex = parseInt($(this).attr("data-index"));
                $modal.addClass("active");
                updateModal();
            });

            $("#next-btn").click(function(e) {
                e.stopPropagation();
                currentIndex = (currentIndex + 1) % imagesArray.length;
                updateModal();
            });

            $("#prev-btn").click(function(e) {
                e.stopPropagation();
                currentIndex = (currentIndex - 1 + imagesArray.length) % imagesArray.length;
                updateModal();
            });

            $("#close-lightbox, #lightbox").click(function(e) {
                if (e.target.id === "lightbox" || e.target.id === "close-lightbox" || $(e.target).closest('#close-lightbox').length) {
                    $modal.removeClass("active");
                }
            });

            // Keyboard Support
            $(document).keydown(function(e) {
                if (!$modal.hasClass("active")) return;
                if (e.keyCode === 37) $("#prev-btn").click(); // Left
                if (e.keyCode === 39) $("#next-btn").click(); // Right
                if (e.keyCode === 27) $modal.removeClass("active"); // Esc
            });
        });
    </script>
</body>
</html>
