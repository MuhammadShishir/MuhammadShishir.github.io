  <style id="theme-style">  
      :root {
          --bg-primary: #FBF9F5;
          --bg-secondary: #F4F0EA;
          --text-main: #1c1917;
          --text-muted: #78716c;

      @font-face {

          src: url('../assets/fonts/TechnoBoard-519Ej.ttf') format('truetype');

      html, body {
          width: 100%;
          max-width: 100%;
          overflow-x: hidden; /* Guards against horizontal scrolling on small screens */
          background-color: var(--bg-primary);
          color: var(--text-main);
          font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      }

      /* Animated Text */
      .animated-text-bg {
          background-image: linear-gradient(90deg, #1c1917, #57534e);
          -webkit-background-clip: text;
          background-clip: text;
          -webkit-text-fill-color: transparent;
          font-family: 'Exwayer', sans-serif;
      }

      /* Banner Section Responsive Padding */
      .banner-section {
          background: linear-gradient(to bottom, #FBF9F5, var(--bg-secondary));
          padding: 60px 16px;
      }
      @media (min-width: 768px) {
          .banner-section {
              padding: 80px 20px;
          }
      }   
      
      .logo-image, .logo-text {
          transition: opacity 0.2s ease-in-out;
      }

      .skill-badge {
          @apply inline-flex items-center px-3.5 py-1.5 text-xs font-medium rounded-md bg-white border border-stone-200 text-stone-800 shadow-sm transition-all duration-200 ease-in-out hover:border-stone-400 hover:shadow;
          animation: fadeIn 0.6s ease-out both; 
      }

      .project-card-vault {
          position: relative;
          border-radius: 12px;
          overflow: hidden;
          background: #ffffff;
          border: 1px solid var(--border-color);
          box-shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.02);
          transition: all 0.2s ease;
          text-align: left;
      }
      
      .project-card-vault:hover {
          border-color: #a8a29e;
          box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.04);
          transform: translateY(-2px);
      }

      .sk-widget-btn, .sk-widget-btn span {
          color: var(--text-main) !important;
      }
      
      .sk-widget-btn {
          display: inline-flex;
          align-items: center;
          gap: 8px;
          padding: 10px 20px;
          background: #ffffff;
          border: 1px solid var(--border-color);
          border-radius: 8px;
          cursor: pointer;
          font-weight: 500;
          font-size: 0.875rem;
          transition: all 0.2s ease;
          box-shadow: 0 1px 2px 0 rgba(0, 0, 0, 0.02);
      }

      .sk-widget-btn:hover {
          background: #f5f3ef;
          border-color: #a8a29e;
          transform: translateY(-1px);
      }

      .sk-widget-btn svg {
          width: 16px;
          height: 16px;
          color: var(--text-muted);
          transition: transform 0.2s ease;
      }

      .sk-widget-btn:hover svg {
          transform: scale(1.1);
      }

      @keyframes fadeIn {
          0% { opacity: 0; transform: translateY(6px); }
          100% { opacity: 1; transform: translateY(0); }
      }
  </style>

  <div id="contactModal" class="fixed inset-0 z-[100] hidden items-center justify-center bg-stone-950/80 backdrop-blur-md p-4 sm:p-6">

          <button id="closeContact" type="button" aria-label="Close modal" class="absolute top-4 right-4 sm:top-6 sm:right-6 w-9 h-9 sm:w-10 sm:h-10 bg-stone-100 hover:bg-stone-900 text-stone-800 hover:text-white border border-stone-300 rounded-full flex items-center justify-center transition-all cursor-pointer">

          <form action="https://formspree.io/f/xanegwyz" method="POST" class="space-y-4">

              </div>

                  <label for="email" class="block text-xs font-mono uppercase tracking-widest text-stone-500 mb-1.5">Email:</label>
                  <input type="email" id="email" name="_replyto" placeholder="Your Email" class="w-full px-4 py-3 rounded-xl bg-stone-50 border border-stone-300 focus:outline-none focus:border-stone-900 text-stone-900 text-sm" required>
              </div>

                  <label for="message" class="block text-xs font-mono uppercase tracking-widest text-stone-500 mb-1.5">Message:</label>
                  <textarea id="message" name="message" rows="4" placeholder="Your Message" class="w-full px-4 py-3 rounded-xl bg-stone-50 border border-stone-300 focus:outline-none focus:border-stone-900 text-stone-900 text-sm resize-none" required></textarea>
              </div>
              <button type="submit" class="w-full py-3.5 rounded-xl bg-stone-900 hover:bg-stone-800 text-white font-medium text-sm transition-all shadow-sm cursor-pointer mt-2">Send Message</button>
          </form>
      </div>
  </div>

  <script>
    document.addEventListener("DOMContentLoaded", function () {
        const scrollToTopBtn = document.getElementById('scrollToTopBtn');
        const contactBtn = document.getElementById("goToContact");
        const contactModal = document.getElementById("contactModal");
        const closeBtn = document.getElementById("closeContact");

        // Scroll listener for Top Button Visibility
        window.addEventListener('scroll', () => {
          if (window.scrollY > 300) {
            scrollToTopBtn.classList.remove('opacity-0', 'translate-y-4', 'pointer-events-none');
            scrollToTopBtn.classList.add('opacity-100', 'translate-y-0');
          } else {
            scrollToTopBtn.classList.remove('opacity-100', 'translate-y-0');
            scrollToTopBtn.classList.add('opacity-0', 'translate-y-4', 'pointer-events-none');
          }
        });

        scrollToTopBtn.addEventListener('click', () => {
          window.scrollTo({
            top: 0,
            behavior: 'smooth'
          });
        });

        // Open Contact Modal
        contactBtn.addEventListener("click", function () {
            contactModal.classList.remove("hidden");
            contactModal.classList.add("flex");
            document.body.style.overflow = "hidden"; // Prevent body scroll when modal is active
        });

        // Close Contact Modal
        function closeModal() {
            contactModal.classList.remove("flex");
            contactModal.classList.add("hidden");
            document.body.style.overflow = ""; // Restore body scroll
        }

        closeBtn.addEventListener("click", closeModal);

        window.addEventListener("click", function (e) {
            if (e.target === contactModal) {
                closeModal();
            }
        });

        document.addEventListener("keydown", function (e) {
            if (e.key === "Escape" && !contactModal.classList.contains("hidden")) {
                closeModal();
            }
        });
    });
  </script>
